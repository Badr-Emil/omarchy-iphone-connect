## Omarchy iPhone Connect: the PC is a hands-free device for phone calls, not a
## Bluetooth speaker. Without the a2dp_sink role, phones keep media (YouTube,
## music) on their own speaker while calls still reach the PC over HFP.
## Bluetooth headphones/speakers used BY this PC need a2dp_source, which stays.
## Undo: delete this file and run: systemctl --user restart wireplumber

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source bap_sink bap_source bap_bcast_sink bap_bcast_source asha_sink hfp_hf hfp_ag hsp_hs hsp_ag ]
}
